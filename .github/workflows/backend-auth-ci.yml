name: Backend Authentication CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/server/**'
      - 'src/lib/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'firebase.json'
      - 'firestore.rules'
      - '.github/workflows/backend-auth-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/server/**'
      - 'src/lib/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'firebase.json'
      - 'firestore.rules'
      - '.github/workflows/backend-auth-ci.yml'
  workflow_dispatch:

jobs:
  auth-security-and-emulator-tests:
    name: Auth Security & Firestore Emulator Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 17 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Run Authentication Security & Migration Test Suites
        run: |
          npm run test:auth
          npm run test:auth:client
          npm run test:auth:real
          npm run test:auth:stage33

      - name: Run Dual-Auth & Firestore Emulator Integration Tests (8 Scenarios)
        env:
          STRICT_EMULATOR_REQUIRED: 'true'
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8085'
          GCLOUD_PROJECT: 'demo-gaminghub-auth-test'
        run: |
          npx --yes firebase-tools@15.35.0 emulators:exec --only firestore --project demo-gaminghub-auth-test "STRICT_EMULATOR_REQUIRED=true FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 GCLOUD_PROJECT=demo-gaminghub-auth-test npm run test:auth:dual && STRICT_EMULATOR_REQUIRED=true FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 GCLOUD_PROJECT=demo-gaminghub-auth-test npm run test:auth:emulator"
