name: Backend Authentication CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/server/**'
      - 'tests/**'
      - 'package.json'
      - 'firebase.json'
      - '.github/workflows/backend-auth-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/server/**'
      - 'tests/**'
      - 'package.json'
      - 'firebase.json'
      - '.github/workflows/backend-auth-ci.yml'
  workflow_dispatch:

jobs:
  auth-security-and-emulator-tests:
    name: Auth Security & Firestore Emulator Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Java 21 for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run In-Memory Security & Regression Tests (Unit)
        run: npm run test:auth

      - name: Run Firestore Emulator Integration Tests
        run: |
          npx --yes firebase-tools@15.35.0 emulators:exec --only firestore --project demo-gaminghub-auth-test "STRICT_EMULATOR_REQUIRED=true npm run test:auth:emulator"
