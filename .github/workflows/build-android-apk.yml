name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      build_notes:
        description: 'Optional build note or reason'
        required: false
        default: 'Manual trigger from Android mobile'
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    name: Assemble Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Verify Components
        run: |
          set -e

          # 1. Resolve Android SDK directory from Runner environment
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_DIR" ]; then
            SDK_DIR="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          fi

          if [ ! -d "$SDK_DIR" ]; then
            echo "::error::Android SDK directory not found on runner."
            exit 1
          fi

          echo "Using Android SDK root: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV

          # 2. Locate sdkmanager executable (check latest first, then numbered versions)
          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -maxdepth 3 -name "sdkmanager" -type f -perm -111 2>/dev/null | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager executable could not be located in $SDK_DIR/cmdline-tools"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version

          # 3. Accept all Android SDK licenses cleanly (do not ignore errors)
          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --licenses

          # 4. Verify & install required platform (platforms;android-34) and build-tools (build-tools;34.0.0)
          echo "Checking required Android SDK components..."
          if [ ! -d "$SDK_DIR/platforms/android-34" ]; then
            echo "Installing missing platforms;android-34..."
            yes | "$SDKMANAGER" "platforms;android-34"
          else
            echo "platforms;android-34 is already installed."
          fi

          if [ ! -d "$SDK_DIR/build-tools/34.0.0" ]; then
            echo "Installing missing build-tools;34.0.0..."
            yes | "$SDKMANAGER" "build-tools;34.0.0"
          else
            echo "build-tools;34.0.0 is already installed."
          fi

          # 5. Final verification of required components
          echo "Verifying installation:"
          ls -ld "$SDK_DIR/platforms/android-34"
          ls -ld "$SDK_DIR/build-tools/34.0.0"
          echo "Android SDK environment verification complete."

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate & Verify Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Print Debug Keystore SHA-1 & SHA-256 for Firebase Registration
        run: |
          echo "==================== ANDROID SIGNING REPORT ===================="
          cd android
          ./gradlew signingReport --no-daemon

          echo "==================== APKSIGNER CERTIFICATE DIGESTS (FROM GENERATED APK) ===================="
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          if [ -f "$APK_FILE" ] && [ -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            "$BUILD_TOOLS_DIR/apksigner" verify --print-certs -v "$APK_FILE"
          else
            echo "Direct keystore inspection:"
            find $HOME -name "debug.keystore" 2>/dev/null | while read k; do
              echo "Found keystore: $k"
              keytool -list -v -keystore "$k" -alias androiddebugkey -storepass android -keypass android | grep -E "(SHA1|SHA256):"
            done
          fi
          echo "=========================================================================================="

      - name: Verify APK Output
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "Successfully generated APK: $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gaminghub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
