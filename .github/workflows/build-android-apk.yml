name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      build_notes:
        description: 'Optional build note or reason'
        required: false
        default: 'Manual trigger from Android mobile'
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    name: Assemble Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate & Verify Gradle Wrapper
        run: |
          cd android
          # Generate the Gradle 8.4 wrapper script and jar using runner-provided Gradle
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Output
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "Successfully generated APK: $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "ERROR: APK not found at $APK_PATH"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gaminghub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
